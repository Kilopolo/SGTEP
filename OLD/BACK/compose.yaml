version: '3.8'

services:
  message-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgtep
    environment:
      SPRING_PROFILES_ACTIVE: default
    image: sgtep:tag
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
networks:
  default:
    name: back_default